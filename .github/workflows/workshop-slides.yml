name: Workshop slides

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/workshop-slides.yml'
      - 'slides/**'
      - 'docs/media/**'
      - 'engineering/runtime.ts'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check the Reveal.js deck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version: '1.4.5'
          no-cache: true
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium and its OS libraries
        run: bun run browser:install --with-deps
      - name: Build and exercise the deck under a project subpath
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          bun run slides:verify
      - name: Retain the reviewed deck
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workshop-slides
          path: artifacts/slides/
          if-no-files-found: error
      - name: Prepare the GitHub Pages artifact
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: artifacts/slides/

  publish:
    name: Publish the approved deck to GitHub Pages
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the tested artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
