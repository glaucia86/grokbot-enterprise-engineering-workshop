name: procurement-hub

services:
  db:
    image: postgres:18.7
    environment:
      POSTGRES_DB: procurement_hub_lab
      POSTGRES_USER: procurement
      POSTGRES_PASSWORD: "${WORKSHOP_DB_PASSWORD:?Copy .env.example to .env first}"
    ports:
      - "127.0.0.1:${WORKSHOP_DB_PORT:-55432}:5432"
    volumes:
      - workshop-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procurement -d procurement_hub_lab"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  workshop-db:
